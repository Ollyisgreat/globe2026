name: Build Firestick APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APKs
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleGlobeRelease assembleUniverseRelease
          cp app/build/outputs/apk/globe/release/app-globe-release.apk MissGlobeTV.apk
          cp app/build/outputs/apk/universe/release/app-universe-release.apk MissUniverseTV.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PageantTV
          path: |
            MissGlobeTV.apk
            MissUniverseTV.apk

      - name: Publish as the latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Pageant TV 1.0.${{ github.run_number }}
          body: |
            Install on the Firestick with the Downloader app:
            Miss Globe TV:    https://github.com/${{ github.repository }}/releases/latest/download/MissGlobeTV.apk
            Miss Universe TV: https://github.com/${{ github.repository }}/releases/latest/download/MissUniverseTV.apk
          files: |
            MissGlobeTV.apk
            MissUniverseTV.apk
          make_latest: true
