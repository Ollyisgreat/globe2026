name: Build Firestick APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk MissGlobeTV.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MissGlobeTV
          path: MissGlobeTV.apk

      - name: Publish as the latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Miss Globe TV 1.0.${{ github.run_number }}
          body: |
            Install on the Firestick with the Downloader app using:
            https://github.com/${{ github.repository }}/releases/latest/download/MissGlobeTV.apk
          files: MissGlobeTV.apk
          make_latest: true
